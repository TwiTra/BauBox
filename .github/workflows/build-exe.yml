name: ScrapeStudio EXE bauen

# Baut die Windows-EXE auf einem Windows-Läufer. Das ist nötig, weil
# PyInstaller nicht über Systemgrenzen hinweg baut: eine Windows-EXE
# entsteht nur unter Windows.
#
# Ergebnis: unter "Actions" -> Lauf auswählen -> Artefakt "ScrapeStudio-Windows".
# Bei einem Tag wie v1.0 entsteht zusätzlich ein Release mit der EXE.

on:
  push:
    branches: [main]
    paths: ['webscraper/**', '.github/workflows/build-exe.yml']
    tags: ['v*']
  pull_request:
    paths: ['webscraper/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:        # von Hand auslösbar

permissions:
  contents: write           # für das Anlegen eines Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webscraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webscraper/requirements.txt

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tests laufen lassen
        run: python tests/run_all.py

      - name: EXE bauen
        run: python build_exe.py

      - name: Ergebnis anzeigen
        run: |
          dir dist
          "$((Get-Item dist/ScrapeStudio.exe).Length / 1MB) MB"
        shell: pwsh

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: ScrapeStudio-Windows
          path: webscraper/dist/ScrapeStudio.exe
          retention-days: 90
          if-no-files-found: error

      - name: Release anlegen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: webscraper/dist/ScrapeStudio.exe
          generate_release_notes: true
