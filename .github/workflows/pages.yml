# Veröffentlicht den Planer über GitHub Pages.
#
# EINMALIG NÖTIG: Settings → Pages → Build and deployment → Source auf
# „GitHub Actions“ stellen. Das Token eines Workflows darf die Pages-Seite
# nicht selbst anlegen („Resource not accessible by integration“), nur auf
# eine bereits eingeschaltete veröffentlichen. Danach läuft alles von allein.
#
# Der Planer ist dann erreichbar unter
#   https://<benutzername>.github.io/<repository>/urlaubsplaner/
# und über die Weiterleitung im Wurzelverzeichnis auch ohne den Unterordner.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
